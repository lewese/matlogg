<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <title>Matlogg</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
    <h1>Matlogg</h1>

    <div class="form">
      <input id="name" placeholder="Måltid" />
      <input id="protein" type="number" placeholder="Protein" />
      <input id="carbs" type="number" placeholder="Kolhydrater" />
      <input id="fat" type="number" placeholder="Fett" />
      <button onclick="saveMeal()">Spara</button>
    </div>

    <div class="dashboard">
      <div class="stat"><span class="stat-value" id="stat-kcal">–</span><span class="stat-label">kcal</span></div>
      <div class="stat"><span class="stat-value" id="stat-protein">–</span><span class="stat-label">protein</span></div>
      <div class="stat"><span class="stat-value" id="stat-carbs">–</span><span class="stat-label">kolhydrater</span></div>
      <div class="stat"><span class="stat-value" id="stat-fat">–</span><span class="stat-label">fett</span></div>
    </div>

    <h2>Måltider</h2>
    <p id="totals"></p>
    <ul id="mealList"></ul>
    <script src="app.js"></script>
    </div>
  </body>
</html>
